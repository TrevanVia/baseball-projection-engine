name: Refresh Savant Data

on:
  schedule:
    - cron: '0 6 * * *'  # 2am ET (6am UTC)
  workflow_dispatch:       # manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Latest season = this year from March on, last year in Jan/Feb.
      - name: Work out seasons
        run: |
          Y=$(date -u +%Y); M=$(date -u +%-m)
          if [ "$M" -lt 3 ]; then Y=$((Y-1)); fi
          echo "SEASON=$Y" >> "$GITHUB_ENV"
          echo "YEARS=$((Y-2)),$((Y-1)),$Y" >> "$GITHUB_ENV"

      - name: Refresh Savant data (last 3 seasons)
        run: node scripts/refresh-savant-data.mjs --years=$YEARS

      # Pitcher Statcast detail (batters faced, xERA, velo, whiff, K%/BB%) for the
      # current season. The step above only fills pitchers' expected stats, and
      # the projection engine needs the rest.
      - name: Refresh pitcher detail (current season)
        run: python3 build_pitcher_data.py $SEASON

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/savant_data.json src/pitcher_savant_data.json src/fg_pitcher_data.json src/baserunning_data.json src/pitch_arsenal_data.json
          git diff --cached --quiet || git commit -m "Refresh Savant data $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
